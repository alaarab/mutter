version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /desktop
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docs/site
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
