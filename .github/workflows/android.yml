name: android

on:
  push:
    paths: ['android/**', 'design/**', 'docs/brand/icon.svg', 'scripts/generate-themes.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'design/**', 'docs/brand/icon.svg', 'scripts/generate-themes.mjs', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-disabled: true
      - run: node scripts/generate-themes.mjs --check
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutter-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
