name: android

on:
  push:
    paths: ['android/**', 'design/**', 'docs/brand/icon.svg', 'scripts/generate-themes.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'design/**', 'docs/brand/icon.svg', 'scripts/generate-themes.mjs', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: node scripts/generate-themes.mjs --check
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mutter-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
