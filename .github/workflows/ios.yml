name: ios

on:
  push:
    branches: [main]
    paths: ['Mutter/**', 'MutterBroadcast/**', 'MutterWidgets/**', 'MutterUITests/**', 'Packages/**', 'web/test/native/**', 'web/test/native.test.mjs', 'web/test/fake-server.mjs', 'web/src/**', 'design/**', 'project.yml', 'Signing.xcconfig', '.github/workflows/ios.yml']
  pull_request:
    paths: ['Mutter/**', 'MutterBroadcast/**', 'MutterWidgets/**', 'MutterUITests/**', 'Packages/**', 'web/test/native/**', 'web/test/native.test.mjs', 'web/test/fake-server.mjs', 'web/src/**', 'design/**', 'project.yml', 'Signing.xcconfig', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node --test web/test/native.test.mjs
      - run: xcodegen generate
      - run: >
          xcodebuild build-for-testing
          -project Mutter.xcodeproj
          -scheme Mutter
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
      - name: Run protocol and client tests on iOS
        shell: bash
        run: |
          mutter_simulator=$(xcrun simctl list devices available -j | node -e '
            let input = "";
            process.stdin.on("data", bytes => input += bytes);
            process.stdin.on("end", () => {
              const device = Object.values(JSON.parse(input).devices).flat()
                .find(device => device.name.startsWith("iPhone"));
              if (!device) throw new Error("No available iPhone simulator");
              console.log(device.udid);
            });
          ')
          xcodebuild test-without-building \
            -project Mutter.xcodeproj \
            -scheme Mutter \
            -destination "id=$mutter_simulator" \
            -only-testing:MutterProtocolTests \
            -only-testing:MutterClientTests \
            CODE_SIGNING_ALLOWED=NO
