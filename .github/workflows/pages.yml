name: docs

on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/**', 'design/**', 'android/README.md', 'android/app/src/main/assets/themes.json', 'web/README.md', 'desktop/README.md', 'scripts/build-docs.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'design/**', 'android/README.md', 'android/app/src/main/assets/themes.json', 'web/README.md', 'desktop/README.md', 'scripts/build-docs.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r docs/site/requirements.txt
      - run: python scripts/build-docs.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .build/pages/mutter

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Publish docs
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
