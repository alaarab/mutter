<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mutter">
  <desc>Dusk Glass: heavy frost over a violet to rose to gold sunset field, deliberately rimless with no bevel or edge light, deep plum ink.</desc>
  <defs>
    <clipPath id="tile-v6"><rect width="512" height="512" rx="114"/></clipPath>
    <filter id="soft-v6" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
    <filter id="grain-v6" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <g id="mark">
    <g clip-path="url(#tile-v6)">
      <rect width="512" height="512" fill="#EE5C82"/>
      <g filter="url(#soft-v6)">
        <circle cx="140" cy="40" r="300" fill="#8A4BE0"/>
        <circle cx="430" cy="150" r="260" fill="#F0468A"/>
        <circle cx="230" cy="480" r="320" fill="#FFB347"/>
      </g>
      <rect width="512" height="512" fill="#FFFFFF" opacity=".38"/>
      <rect width="512" height="512" filter="url(#grain-v6)" opacity=".11" style="mix-blend-mode:overlay"/>
    </g>
    <path d="M90 380L90 128L154 128L256 288.4L358 128L422 128L422 380L360 380L360 225.5L256 389L152 225.5L152 380Z" fill="#3A0F2E"/>
  </g>
</svg>
