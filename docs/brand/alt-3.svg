<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mutter">
  <desc>Cobalt Glass: a deep blue into violet field under a low frost with a white mark, and one hard bright rim along the top edge only.</desc>
  <defs>
    <clipPath id="tile-v3"><rect width="512" height="512" rx="114"/></clipPath>
    <filter id="soft-v3" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain-v3" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="rim-v3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".30"/>
    </linearGradient>
  </defs>
  <g id="mark">
    <g clip-path="url(#tile-v3)">
      <rect width="512" height="512" fill="#1E2FD8"/>
      <g filter="url(#soft-v3)">
        <circle cx="110" cy="90" r="300" fill="#3358FF"/>
        <circle cx="450" cy="420" r="330" fill="#7A2BF0"/>
        <circle cx="60" cy="470" r="250" fill="#0B1470"/>
      </g>
      <rect width="512" height="512" fill="#FFFFFF" opacity=".07"/>
      <rect width="512" height="512" filter="url(#grain-v3)" opacity=".06" style="mix-blend-mode:overlay"/>
    </g>
    <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="url(#rim-v3)" stroke-width="3"/>
    <path d="M128 370L128 230C128 140 200 140 256 290C312 140 384 140 384 230L384 370" fill="none" stroke-width="54" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="6" stroke="#FFFFFF"/>
  </g>
</svg>
