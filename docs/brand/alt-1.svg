<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mutter">
  <desc>Frosted Cyan: a cyan into magenta mesh field under a medium frost, grain instead of gloss, one hairline rim lit from the top left, deep ink mark.</desc>
  <defs>
    <clipPath id="tile-v1"><rect width="512" height="512" rx="114"/></clipPath>
    <filter id="soft-v1" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="85"/>
    </filter>
    <filter id="grain-v1" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="veil-v1" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".27"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="rim-v1" x1=".05" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2A1136" stop-opacity=".30"/>
    </linearGradient>
  </defs>
  <g id="mark">
    <g clip-path="url(#tile-v1)">
      <rect width="512" height="512" fill="#2AA6EA"/>
      <g filter="url(#soft-v1)">
        <circle cx="90" cy="70" r="300" fill="#22D3F5"/>
        <circle cx="470" cy="430" r="320" fill="#E22BB4"/>
        <circle cx="300" cy="200" r="210" fill="#6F5BF2"/>
      </g>
      <rect width="512" height="512" fill="url(#veil-v1)"/>
      <rect width="512" height="512" filter="url(#grain-v1)" opacity=".07" style="mix-blend-mode:overlay"/>
    </g>
    <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="url(#rim-v1)" stroke-width="3"/>
    <path d="M128 370L128 230C128 140 200 140 256 290C312 140 384 140 384 230L384 370" fill="none" stroke-width="54" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="6" stroke="#140F22"/>
  </g>
</svg>
