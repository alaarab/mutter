<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mutter">
  <desc>Smoked Carbon: a near monochrome smoked pane barely lighter than the carbon ground, defined only by its rim, with a near white mark. Tuned for a dark interface.</desc>
  <defs>
    <clipPath id="tile-v5"><rect width="512" height="512" rx="114"/></clipPath>
    <filter id="soft-v5" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain-v5" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="rim-v5" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".52"/>
      <stop offset=".4" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset=".75" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".20"/>
    </linearGradient>
  </defs>
  <g id="mark">
    <g clip-path="url(#tile-v5)">
      <rect width="512" height="512" fill="#141419"/>
      <g filter="url(#soft-v5)">
        <circle cx="110" cy="80" r="300" fill="#1F2836"/>
        <circle cx="450" cy="450" r="320" fill="#2A2028"/>
        <circle cx="280" cy="260" r="200" fill="#191922"/>
      </g>
      <rect width="512" height="512" fill="#FFFFFF" opacity=".06"/>
      <rect width="512" height="512" filter="url(#grain-v5)" opacity=".10" style="mix-blend-mode:overlay"/>
    </g>
    <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="url(#rim-v5)" stroke-width="3"/>
    <path d="M128 370L128 230C128 140 200 140 256 290C312 140 384 140 384 230L384 370" fill="none" stroke-width="54" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="6" stroke="#F2F2F5"/>
  </g>
</svg>
