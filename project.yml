# XcodeGen manifest. Run `xcodegen generate` in this directory to produce Mutter.xcodeproj.
# Install XcodeGen with `brew install xcodegen`.
name: Mutter
options:
  bundleIdPrefix: com.alaarab
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MumbleCore:
    path: Packages/MumbleCore
  Opus:
    url: https://github.com/OnBeep/Opus-iOS.git
    from: 1.9.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Mutter:
    type: application
    platform: iOS
    sources:
      - path: Mutter
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: MumbleCore
        product: MumbleClient
      - package: MumbleCore
        product: MumbleProtocol
      - package: Opus
        product: Opus
      - target: MutterWidgets
    info:
      path: Mutter/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mutter
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - voip
        NSMicrophoneUsageDescription: Mutter needs the microphone so other people in your channel can hear you.
        NSLocalNetworkUsageDescription: Mutter looks for Mumble servers on your local network.
        NSBonjourServices:
          - _mumble._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - BricolageDisplay-SemiBold.ttf
          - BricolageDisplay-Bold.ttf
          - BricolageDisplay-ExtraBold.ttf
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alaarab.mutter
        SWIFT_OBJC_BRIDGING_HEADER: Mutter/Mutter-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Mutter/Audio/OpusShim"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: "-ObjC"
    entitlements:
      path: Mutter/Resources/Mutter.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.alaarab.mutter

  MutterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MutterWidgets
      - path: Mutter/Shared
      - path: Mutter/Design/Theme.swift
      - path: Mutter/Resources/Fonts
        buildPhase: resources
    info:
      path: MutterWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mutter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - BricolageDisplay-SemiBold.ttf
          - BricolageDisplay-Bold.ttf
          - BricolageDisplay-ExtraBold.ttf
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alaarab.mutter.widgets
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_CFBundleDisplayName: Mutter

schemes:
  Mutter:
    build:
      targets:
        Mutter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: MumbleCore/MumbleProtocolTests
    archive:
      config: Release
